[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printlabelms"
version = "0.3.2"
description = "PyQt5-приложение: печать этикеток из МойСклада — ассортимент и шаблоны через moy_sklad, PDF→JPEG (pypdfium2), печать на термопринтере"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "gusya1" }]
license = { text = "MIT" }
dependencies = [
    "PyQt5>=5.15.6",
    "moy_sklad @ git+https://github.com/gusya1/moy_sklad@v0.1.0",
    "pydantic>=2.11",
    "requests>=2.32",
    "pypdfium2>=5.15",
    "Pillow>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.8",
    "build>=1.6",
]

[project.scripts]
printlabelms = "PrintLabelMS.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
artifacts = ["src/gui/ui/*"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/PrintLabelMS",
    "src/config",
    "src/gui",
    "src/moysklad_manager",
    "src/pdf_to_image_converter",
    "src/updater",
    "src/resources",
]

[tool.ruff]
line-length = 121

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "D",
]
ignore = [
    "UP032",
    "D212",
    "D104",
    "D100",
    "D101",
    "D102",
    "D103",
    "D107",
    "D211",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
